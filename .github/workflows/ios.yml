# iOS build checks on GitHub's macOS runner (free for public repos).
#  - simulator: every push/PR touching the app, and manual. Unsigned simulator build: proves the Swift code
#    (VisionOCR plugin, MainViewController) and the Capacitor SPM plugins compile. Needs no secrets.
#  - testflight: manual only (Actions tab > iOS > Run workflow > testflight = true). Archives a signed build with
#    automatic signing and uploads it to App Store Connect / TestFlight. Needs the ASC_* secrets; skipped without them.
# The live PWA deploy (pages workflow) is not affected by this file.
name: iOS

on:
  push:
    branches: [main, ios-prep, v1-features]
    paths: ['ios/**', 'src/**', 'package.json', 'package-lock.json', 'capacitor.config.ts', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'package.json', 'package-lock.json', 'capacitor.config.ts']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Archive, sign and upload to TestFlight (needs ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 secrets)'
        type: boolean
        default: false
      build_number:
        description: 'Build number (CFBundleVersion). Empty = run number + 100'
        type: string
        default: ''
      pro_enabled:
        description: 'Show LetterScan Pro (paywall). Only once the IAP com.benjiferguson.letterscan.pro exists in App Store Connect'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Unsigned simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - name: Web bundle (root base path for the app)
        run: npm run build
      - name: Capacitor sync (copies dist/ into ios/App/App/public, writes Package.swift)
        run: npx cap sync ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-simulator-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

  testflight:
    name: Signed archive + TestFlight upload
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "ASC_* secrets not set: skipping signed build (see appstore/testflight-setup.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode
        if: steps.secrets.outputs.ok == 'true'
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Build web bundle + sync
        if: steps.secrets.outputs.ok == 'true'
        env:
          VITE_PRO_ENABLED: ${{ inputs.pro_enabled && 'true' || 'false' }}
        run: echo "VITE_PRO_ENABLED=$VITE_PRO_ENABLED" && npm ci && npm run build && npx cap sync ios
      - name: Write API key file
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Distribution certificate + App Store profile (fastlane, API key)
        if: steps.secrets.outputs.ok == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p build
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": open(os.environ["ASC_KEY_PATH"]).read(), "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc", "api_key.json"), "w"))
          PY
          API="$RUNNER_TEMP/asc/api_key.json"
          fastlane run get_certificates api_key_path:"$API" development:false \
            keychain_path:"$KC" keychain_password:"$KCPW" output_path:"$RUNNER_TEMP/asc"
          fastlane run get_provisioning_profile api_key_path:"$API" \
            app_identifier:"com.benjiferguson.letterscan" team_id:"$TEAM" \
            output_path:"$RUNNER_TEMP/asc" filename:"appstore.mobileprovision"
          PP="$RUNNER_TEMP/asc/appstore.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP" > build/pp.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' build/pp.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' build/pp.plist)
          cp "$PP" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PP_NAME=$NAME" >> "$GITHUB_ENV"
          # Manual signing on the App target only (SPM framework targets keep their defaults)
          fastlane run update_code_signing_settings path:"ios/App/App.xcodeproj" targets:"App" \
            build_configurations:"Release" use_automatic_signing:false team_id:"$TEAM" \
            code_sign_identity:"Apple Distribution" profile_name:"$NAME"
      - name: Archive (signed with Apple Distribution)
        if: steps.secrets.outputs.ok == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          BUILD_NO="${{ inputs.build_number }}"
          [ -n "$BUILD_NO" ] || BUILD_NO=$(( ${{ github.run_number }} + 100 ))
          case "$BUILD_NO" in (*[!0-9]*|'') echo "build_number must be digits"; exit 1;; esac
          echo "Build number: $BUILD_NO"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD_NO \
            | tee build/archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log
      - name: Export + upload to App Store Connect (TestFlight)
        if: steps.secrets.outputs.ok == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.benjiferguson.letterscan</key><string>$PP_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"; security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - name: Keep logs
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: build/archive.log
          if-no-files-found: ignore
