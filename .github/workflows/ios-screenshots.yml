# App Store screenshots on the iOS Simulator (manual run only; free on public repos).
# Builds the app with VITE_SHOTS=1 (adds src/lib/shots.ts, which draws the fake sample letters in
# src/lib/shots-letters.ts and feeds them through the normal file input, so every card comes from the real on-device pipeline), installs it on the largest
# iPhone simulator on the runner (6.9", 1320x2868), and takes one screenshot per scene in appstore/shots/scenes.json.
# Output: artifact "appstore-screenshots". Release builds (ios.yml) never include the screenshot driver or the letters.
name: iOS screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator name (empty = newest "iPhone * Pro Max")'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - name: Web bundle with the screenshot driver (fake letters are drawn in the app)
        run: |
          VITE_SHOTS=1 npm run build
          npx cap sync ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Boot simulator
        env:
          WANT: ${{ inputs.device }}
        run: |
          xcrun simctl list devices available -j > devices.json
          UDID=$(python3 - <<'PY'
          import json, os, re
          want = os.environ.get("WANT", "").strip()
          devs = [d | {"rt": rt} for rt, ds in json.load(open("devices.json"))["devices"].items() if "iOS" in rt for d in ds]
          def ver(rt): return [int(x) for x in re.findall(r"\d+", rt)]
          pick = [d for d in devs if d["name"] == want] if want else [d for d in devs if re.fullmatch(r"iPhone \d+ Pro Max", d["name"])]
          pick.sort(key=lambda d: (ver(d["rt"]), d["name"]))
          print(pick[-1]["udid"]); open("device.txt", "w").write(pick[-1]["name"] + " / " + pick[-1]["rt"])
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"; cat device.txt
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/App.app)
          xcrun simctl install "$UDID" "$APP"
      - name: Screenshots
        run: |
          set -e
          BID=com.benjiferguson.letterscan
          mkdir -p shots
          python3 -c "import json;[print(json.dumps(s)) for s in json.load(open('appstore/shots/scenes.json'))]" > scenes.ndjson
          while read -r S; do
            NAME=$(echo "$S" | python3 -c "import json,sys;print(json.load(sys.stdin)['name'])")
            WAIT=$(echo "$S" | python3 -c "import json,sys;print(json.load(sys.stdin).get('wait',30))")
            C=$(xcrun simctl get_app_container "$UDID" $BID app < /dev/null)
            echo "$S" > "$C/public/shot.json"
            xcrun simctl launch "$UDID" $BID < /dev/null
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot --type=png "shots/$NAME.png" < /dev/null
            xcrun simctl terminate "$UDID" $BID < /dev/null || true
            sleep 2
          done < scenes.ndjson
          for f in shots/*.png; do echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{print $2}' | xargs)"; done
          cp device.txt shots/
      - name: Device check (Vision languages, OCR per language, speech voices) -> shots/diag.json
        if: always()
        run: |
          BID=com.benjiferguson.letterscan
          C=$(xcrun simctl get_app_container "$UDID" $BID app < /dev/null)
          # picker test files: the sample ticket as HEIC (sips, like an iPhone photo), a large JPEG and a PNG
          sips -s format heic test-docs/real/de_parking_ticket_iphone_frame.jpg --out "$C/public/pick-test.heic" >/dev/null
          sips -Z 4400 -s format jpeg test-docs/real/de_parking_ticket_iphone_frame.jpg --out "$C/public/pick-test.jpg" >/dev/null
          sips -s format png test-docs/real/de_parking_ticket_iphone_frame.jpg --out "$C/public/pick-test.png" >/dev/null
          ls -l "$C/public/" | grep pick-test || true
          echo '{"scene":"diag"}' > "$C/public/shot.json"
          xcrun simctl launch "$UDID" $BID < /dev/null
          D=$(xcrun simctl get_app_container "$UDID" $BID data < /dev/null)
          for i in $(seq 1 120); do
            sleep 10
            if [ -f "$D/Documents/diag.json" ] && grep -q '"done": true' "$D/Documents/diag.json"; then break; fi
          done
          cp "$D/Documents/diag.json" shots/diag.json || echo "no diag.json"
          xcrun simctl terminate "$UDID" $BID < /dev/null || true
          rm -f "$C/public/shot.json" "$C/public"/pick-test.*
          python3 -c "import json;d=json.load(open('shots/diag.json'));print(json.dumps({k:v for k,v in d.items() if k!='ocr'},indent=1));[print(l, {k:(v.get('engine',''),v.get('accuracy'),v.get('error'),v.get('detected')) for k,v in r.items()}) for l,r in d.get('ocr',{}).items()]" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-screenshots
          path: shots/
          if-no-files-found: warn
